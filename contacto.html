<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Academy - Contactos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dance Academy</h1>
        <p>uma academia de dança</p>
        <button id="btn-theme" class="btn-interativo">Modo Escuro</button>
    </header>

    <nav>
        <a href="main.html">Home</a>
        <a href="info.html">Notícias</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="contacto-seccao">
            <h2>Fale Connosco</h2>
            
            <div class="info-contacto card">
                <p><strong>Localização:</strong> Rua Exemplo, 123, Porto</p>
                <p><strong>Email:</strong> DanceAcademy@gmail.com</p>
                <p><strong>Telefone:</strong> +351 912 345 678</p>
            </div>

            <!-- Formulário de Contacto -->
            <form id="form-contacto" class="form-estilizado card">
                <h3>Envie-nos uma mensagem</h3>
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="O seu nome completo">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">

                <label for="modalidade">Modalidade de Interesse:</label>
                <select id="modalidade" name="modalidade">
                    <option value="ballet">Ballet Clássico</option>
                    <option value="hiphop">Hip Hop</option>
                    <option value="salao">Danças de Salão</option>
                    <option value="contemporaneo">Dança Contemporânea</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva a sua mensagem aqui..."></textarea>

                <button type="submit" class="btn-interativo">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dance Academy - Todos os direitos reservados. Editado por Mota.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
